name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration integrity
        run: |
          python -c "from src.config import load_config; cfg = load_config('configs/train_config.yaml'); print('Config loaded successfully:', cfg['model']['name'])"

      - name: Run lightweight unit tests
        run: |
          pytest tests/ -v --durations=10
